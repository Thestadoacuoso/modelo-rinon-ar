<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#091019">

  <title>Modelo renal 3D · AR interactiva</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
    }
  }
  </script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #091019;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #gestureLayer {
      position: fixed;
      inset: 0;
      z-index: 10;
      touch-action: none;
      pointer-events: auto;
    }

    #top {
      position: fixed;
      z-index: 40;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 11px 14px;
      border-radius: 14px;
      background: rgba(5,10,17,.78);
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    #top strong {
      display: block;
      margin-bottom: 4px;
      font-size: 16px;
    }

    #status {
      font-size: 13px;
      color: rgba(255,255,255,.82);
    }

    #help {
      position: fixed;
      z-index: 40;
      left: 50%;
      bottom: 82px;
      transform: translateX(-50%);
      width: min(94vw, 680px);
      padding: 9px 12px;
      border-radius: 13px;
      background: rgba(5,10,17,.72);
      text-align: center;
      font-size: 12px;
      line-height: 1.45;
      pointer-events: none;
    }

    #controls {
      position: fixed;
      z-index: 50;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px;
      width: min(96vw, 720px);
      pointer-events: auto;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 11px 15px;
      background: rgba(6,12,20,.94);
      color: white;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 5px 20px rgba(0,0,0,.28);
      touch-action: manipulation;
    }

    button.primary { background: #2563eb; }

    button:disabled { opacity: .4; }

    #arHost {
      position: fixed;
      z-index: 60;
      right: 14px;
      top: 82px;
      pointer-events: auto;
    }

    #arHost button {
      position: static !important;
      width: auto !important;
      min-width: 190px !important;
      height: auto !important;
      padding: 12px 16px !important;
      border: 0 !important;
      border-radius: 999px !important;
      background: #2563eb !important;
      color: white !important;
      font: 800 13px Arial, Helvetica, sans-serif !important;
      opacity: 1 !important;
    }

    #loading {
      position: fixed;
      z-index: 100;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      background: #091019;
      transition: opacity .3s ease;
      pointer-events: none;
    }

    #loading.hide { opacity: 0; }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(255,255,255,.18);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

<div id="loading">
  <div class="spinner"></div>
  <div>Cargando modelo renal definitivo…</div>
</div>

<div id="top">
  <strong>Modelo renal 3D · AR interactiva</strong>
  <div id="status">Cargando modelo calibrado…</div>
</div>

<div id="arHost"></div>

<div id="help">
  1 dedo = rotar libremente · 2 dedos = mover sobre la superficie · pellizco = tamaño
</div>

<div id="controls">
  <button id="placeBtn" class="primary" disabled>COLOCAR AQUÍ</button>
  <button id="repositionBtn" disabled>Reubicar</button>
  <button id="resetBtn" disabled>Restablecer pose</button>
</div>

<div id="gestureLayer"></div>

<script type="module">
  import * as THREE from "three";
  import { ARButton } from "three/addons/webxr/ARButton.js";
  import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

  // ==========================================================
  // CONFIGURACIÓN
  // ==========================================================

  /*
    IMPORTANTE:
    El GLB ya está físicamente rotado en la posición que aprobaste.
    NO se aplica ninguna rotación adicional al entrar en AR.

    El ?v=FINAL-HILIO-1 evita que Chrome/Render reutilicen una
    copia antigua del archivo con la misma ruta.
  */
  const MODEL_URL =
    "./assets/modelo_ar_calibrado.glb?v=FINAL-HILIO-1";

  const INITIAL_SCALE = 1.0;

  // ==========================================================
  // DOM
  // ==========================================================

  const statusEl = document.querySelector("#status");
  const loading = document.querySelector("#loading");
  const gestureLayer = document.querySelector("#gestureLayer");
  const placeBtn = document.querySelector("#placeBtn");
  const repositionBtn = document.querySelector("#repositionBtn");
  const resetBtn = document.querySelector("#resetBtn");
  const arHost = document.querySelector("#arHost");

  // ==========================================================
  // THREE
  // ==========================================================

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.01,
    50
  );

  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true,
    powerPreference: "high-performance"
  });

  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.66;

  document.body.prepend(renderer.domElement);

  // ==========================================================
  // ILUMINACIÓN CONTROLADA
  // ==========================================================

  scene.add(
    new THREE.HemisphereLight(
      0xffffff,
      0x263241,
      1.0
    )
  );

  const keyLight = new THREE.DirectionalLight(
    0xffffff,
    0.68
  );

  keyLight.position.set(-2, 4, 3);
  scene.add(keyLight);

  // ==========================================================
  // MODELO
  // ==========================================================

  /*
    placementRoot:
    sólo controla posición física sobre la mesa.

    interactionRoot:
    sólo controla rotación y escala del usuario.

    Separarlos evita que la detección de superficie cambie
    la orientación calibrada del GLB.
  */
  const placementRoot = new THREE.Group();
  const interactionRoot = new THREE.Group();

  interactionRoot.rotation.order = "YXZ";

  placementRoot.add(interactionRoot);
  scene.add(placementRoot);

  placementRoot.visible = false;

  let modelReady = false;
  let placed = false;

  let rotationX = 0;
  let rotationY = 0;
  let currentScale = INITIAL_SCALE;

  const loader = new GLTFLoader();

  loader.load(
    MODEL_URL,

    gltf => {
      const model = gltf.scene;

      /*
        NO rotateX(), NO rotateY(), NO quaternion de superficie.
        El archivo ya trae la pose correcta.
      */
      model.position.set(0, 0, 0);
      model.rotation.set(0, 0, 0);
      model.scale.set(1, 1, 1);

      model.traverse(child => {
        if (child.isMesh) {
          child.frustumCulled = false;
        }
      });

      interactionRoot.add(model);

      interactionRoot.rotation.set(0, 0, 0, "YXZ");
      interactionRoot.scale.setScalar(INITIAL_SCALE);

      modelReady = true;

      statusEl.textContent =
        "Modelo definitivo listo ✓ · pulsa INICIAR AR INTERACTIVA.";

      loading.classList.add("hide");

      setTimeout(() => {
        loading.style.display = "none";
      }, 350);
    },

    xhr => {
      if (xhr.total) {
        const p = Math.round(xhr.loaded / xhr.total * 100);
        statusEl.textContent = `Cargando modelo… ${p}%`;
      }
    },

    error => {
      console.error(error);
      statusEl.textContent =
        "ERROR cargando assets/modelo_ar_calibrado.glb";
    }
  );

  // ==========================================================
  // AR WEBXR — NO SCENE VIEWER
  // ==========================================================

  const arButton = ARButton.createButton(
    renderer,
    {
      requiredFeatures: ["hit-test"],
      optionalFeatures: ["dom-overlay", "local-floor"],
      domOverlay: {
        root: document.body
      }
    }
  );

  /*
    Si ves este texto sabemos que NO estás en el viejo
    model-viewer/Scene Viewer.
  */
  arButton.textContent = "INICIAR AR INTERACTIVA";

  arHost.appendChild(arButton);

  // ==========================================================
  // HIT TEST
  // ==========================================================

  const reticle = new THREE.Mesh(
    new THREE.RingGeometry(
      0.055,
      0.075,
      40
    ).rotateX(-Math.PI / 2),

    new THREE.MeshBasicMaterial({
      color: 0x45ff88
    })
  );

  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  let hitTestSource = null;
  let hitTestSourceRequested = false;

  function resetHitTest() {
    hitTestSource = null;
    hitTestSourceRequested = false;
    reticle.visible = false;
    placeBtn.disabled = true;
  }

  renderer.xr.addEventListener(
    "sessionstart",
    () => {
      statusEl.textContent =
        "AR activa · busca una superficie plana.";
      resetHitTest();
    }
  );

  renderer.xr.addEventListener(
    "sessionend",
    () => {
      statusEl.textContent =
        "Sesión AR finalizada.";
      resetHitTest();
    }
  );

  // ==========================================================
  // COLOCAR
  // ==========================================================

  function placeModel() {
    if (!reticle.visible || !modelReady) return;

    const position = new THREE.Vector3();
    position.setFromMatrixPosition(reticle.matrix);

    /*
      ÉSTA ES LA CLAVE:
      tomamos sólo XYZ de la superficie.

      NO copiamos su quaternion/matriz de rotación.
      Por tanto el riñón conserva la orientación horneada
      dentro de modelo_ar_calibrado.glb.
    */
    placementRoot.position.copy(position);
    placementRoot.rotation.set(0, 0, 0);
    placementRoot.quaternion.identity();

    rotationX = 0;
    rotationY = 0;
    currentScale = INITIAL_SCALE;

    interactionRoot.rotation.set(
      0,
      0,
      0,
      "YXZ"
    );

    interactionRoot.scale.setScalar(
      currentScale
    );

    placementRoot.visible = true;
    placed = true;

    reticle.visible = false;
    placeBtn.disabled = true;
    repositionBtn.disabled = false;
    resetBtn.disabled = false;

    statusEl.textContent =
      "Riñón colocado ✓ · 1 dedo rota, 2 dedos mueven y pellizco escala.";
  }

  placeBtn.addEventListener(
    "click",
    event => {
      event.stopPropagation();
      placeModel();
    }
  );

  repositionBtn.addEventListener(
    "click",
    event => {
      event.stopPropagation();

      placed = false;
      placementRoot.visible = false;

      repositionBtn.disabled = true;
      resetBtn.disabled = true;

      statusEl.textContent =
        "Busca otra superficie y pulsa COLOCAR AQUÍ.";
    }
  );

  resetBtn.addEventListener(
    "click",
    event => {
      event.stopPropagation();

      rotationX = 0;
      rotationY = 0;
      currentScale = INITIAL_SCALE;

      interactionRoot.rotation.set(
        0,
        0,
        0,
        "YXZ"
      );

      interactionRoot.scale.setScalar(
        currentScale
      );

      statusEl.textContent =
        "Pose inicial del GLB restaurada.";
    }
  );

  // ==========================================================
  // GESTOS
  // ==========================================================

  const pointers = new Map();

  let previousSingle = null;
  let previousMidpoint = null;
  let previousDistance = null;

  function midpoint(a, b) {
    return {
      x: (a.x + b.x) / 2,
      y: (a.y + b.y) / 2
    };
  }

  function distance(a, b) {
    return Math.hypot(
      b.x - a.x,
      b.y - a.y
    );
  }

  function clearGestureReferences() {
    previousSingle = null;
    previousMidpoint = null;
    previousDistance = null;
  }

  gestureLayer.addEventListener(
    "pointerdown",
    event => {
      gestureLayer.setPointerCapture(
        event.pointerId
      );

      pointers.set(
        event.pointerId,
        {
          x: event.clientX,
          y: event.clientY
        }
      );

      clearGestureReferences();
    }
  );

  gestureLayer.addEventListener(
    "pointermove",
    event => {
      if (!pointers.has(event.pointerId)) {
        return;
      }

      pointers.set(
        event.pointerId,
        {
          x: event.clientX,
          y: event.clientY
        }
      );

      if (!placed) return;

      const pts =
        Array.from(pointers.values());

      // ------------------------------------------------------
      // 1 DEDO = ROTACIÓN LIBRE
      // ------------------------------------------------------

      if (pts.length === 1) {
        const p = pts[0];

        if (previousSingle) {
          const dx =
            p.x - previousSingle.x;

          const dy =
            p.y - previousSingle.y;

          rotationY += dx * 0.008;
          rotationX += dy * 0.008;

          rotationX =
            THREE.MathUtils.euclideanModulo(
              rotationX + Math.PI,
              Math.PI * 2
            ) - Math.PI;

          rotationY =
            THREE.MathUtils.euclideanModulo(
              rotationY + Math.PI,
              Math.PI * 2
            ) - Math.PI;

          interactionRoot.rotation.set(
            rotationX,
            rotationY,
            0,
            "YXZ"
          );
        }

        previousSingle = { ...p };
        previousMidpoint = null;
        previousDistance = null;
      }

      // ------------------------------------------------------
      // 2 DEDOS = MOVER + PINCH
      // ------------------------------------------------------

      else if (pts.length >= 2) {
        const a = pts[0];
        const b = pts[1];

        const mid = midpoint(a, b);
        const dist = distance(a, b);

        if (previousMidpoint) {
          const dx =
            mid.x - previousMidpoint.x;

          const dy =
            mid.y - previousMidpoint.y;

          const xrCamera =
            renderer.xr.getCamera(camera);

          const camQ =
            new THREE.Quaternion();

          xrCamera.getWorldQuaternion(camQ);

          const right =
            new THREE.Vector3(1, 0, 0)
            .applyQuaternion(camQ);

          right.y = 0;

          if (right.lengthSq() > 0.000001) {
            right.normalize();
          }

          const forward =
            new THREE.Vector3(0, 0, -1)
            .applyQuaternion(camQ);

          forward.y = 0;

          if (forward.lengthSq() > 0.000001) {
            forward.normalize();
          }

          const moveFactor = 0.00072;

          placementRoot.position.addScaledVector(
            right,
            dx * moveFactor
          );

          placementRoot.position.addScaledVector(
            forward,
            -dy * moveFactor
          );
        }

        if (
          previousDistance &&
          previousDistance > 0
        ) {
          const ratio =
            dist / previousDistance;

          currentScale *= ratio;

          currentScale =
            THREE.MathUtils.clamp(
              currentScale,
              0.20,
              5.0
            );

          interactionRoot.scale.setScalar(
            currentScale
          );
        }

        previousMidpoint = { ...mid };
        previousDistance = dist;
        previousSingle = null;
      }
    }
  );

  function removePointer(event) {
    pointers.delete(event.pointerId);
    clearGestureReferences();
  }

  gestureLayer.addEventListener(
    "pointerup",
    removePointer
  );

  gestureLayer.addEventListener(
    "pointercancel",
    removePointer
  );

  // ==========================================================
  // RESPONSIVE
  // ==========================================================

  window.addEventListener(
    "resize",
    () => {
      camera.aspect =
        window.innerWidth /
        window.innerHeight;

      camera.updateProjectionMatrix();

      renderer.setSize(
        window.innerWidth,
        window.innerHeight
      );
    }
  );

  // ==========================================================
  // LOOP AR
  // ==========================================================

  renderer.setAnimationLoop(
    (time, frame) => {
      if (frame) {
        const session =
          renderer.xr.getSession();

        if (!hitTestSourceRequested) {
          session
          .requestReferenceSpace("viewer")
          .then(referenceSpace => {
            session
            .requestHitTestSource({
              space: referenceSpace
            })
            .then(source => {
              hitTestSource = source;
            });
          });

          session.addEventListener(
            "end",
            () => {
              hitTestSourceRequested = false;
              hitTestSource = null;
            }
          );

          hitTestSourceRequested = true;
        }

        if (hitTestSource) {
          const referenceSpace =
            renderer.xr.getReferenceSpace();

          const results =
            frame.getHitTestResults(
              hitTestSource
            );

          if (results.length > 0) {
            const hit = results[0];

            const pose =
              hit.getPose(
                referenceSpace
              );

            reticle.matrix.fromArray(
              pose.transform.matrix
            );

            if (!placed) {
              reticle.visible = true;
              placeBtn.disabled = false;

              statusEl.textContent =
                "Superficie detectada ✓ · pulsa COLOCAR AQUÍ.";
            }
          }

          else if (!placed) {
            reticle.visible = false;
            placeBtn.disabled = true;

            statusEl.textContent =
              "Buscando superficie… mueve lentamente el celular.";
          }
        }
      }

      renderer.render(
        scene,
        camera
      );
    }
  );

</script>

</body>
</html>
