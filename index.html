<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >
  <meta name="theme-color" content="#091019">

  <title>Visor 3D interactivo · Riñón</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #091019;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    #viewer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    a-scene {
      width: 100% !important;
      height: 100% !important;
    }

    .a-enter-vr,
    .a-enter-ar,
    .a-orientation-modal {
      display: none !important;
    }

    #top {
      position: fixed;
      z-index: 30;
      left: 14px;
      right: 14px;
      top: 14px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(6, 11, 18, .78);
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    #top strong {
      display: block;
      font-size: 16px;
      margin-bottom: 4px;
    }

    #status {
      font-size: 12px;
      color: rgba(255,255,255,.80);
    }

    #help {
      position: fixed;
      z-index: 30;
      left: 50%;
      bottom: 82px;
      transform: translateX(-50%);
      width: min(92vw, 620px);
      padding: 10px 13px;
      border-radius: 13px;
      background: rgba(6, 11, 18, .74);
      text-align: center;
      font-size: 12px;
      line-height: 1.45;
      pointer-events: none;
    }

    #controls {
      position: fixed;
      z-index: 35;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      gap: 8px;
      width: min(94vw, 620px);
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 11px 15px;
      background: rgba(6, 11, 18, .92);
      color: white;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 6px 22px rgba(0,0,0,.28);
      touch-action: manipulation;
    }

    button:active {
      transform: scale(.96);
    }
  </style>
</head>

<body>

  <div id="top">
    <strong>Modelo renal 3D · interacción táctil</strong>
    <div id="status">Cargando modelo calibrado…</div>
  </div>

  <div id="help">
    1 dedo: gira el órgano · 2 dedos: muévelo · pellizco: cambia su tamaño
  </div>

  <div id="controls">
    <button id="reset">Restablecer pose</button>
    <button id="center">Centrar</button>
  </div>

  <div id="viewer">

    <a-scene
      embedded
      vr-mode-ui="enabled:false"
      renderer="antialias:true; colorManagement:true; physicallyCorrectLights:true;"
      background="color:#091019"
    >

      <a-assets timeout="60000">
        <a-asset-item
          id="renalAsset"
          src="./assets/modelo_ar_calibrado.glb"
        ></a-asset-item>
      </a-assets>

      <!--
        El GLB YA contiene la orientación calibrada.
        Por eso este contenedor inicia sin rotación adicional.
      -->
      <a-entity
        id="modelRoot"
        position="0 0 0"
        rotation="0 0 0"
        scale="1 1 1"
      >
        <a-entity
          id="renalModel"
          gltf-model="#renalAsset"
        ></a-entity>
      </a-entity>

      <a-light
        type="ambient"
        color="#ffffff"
        intensity="0.95"
      ></a-light>

      <a-light
        type="directional"
        color="#ffffff"
        intensity="0.75"
        position="-2 4 3"
      ></a-light>

      <a-light
        type="directional"
        color="#d8e6ff"
        intensity="0.25"
        position="3 1 -2"
      ></a-light>

      <a-camera
        id="camera"
        position="0 0 0.45"
        look-controls="enabled:false"
        wasd-controls="enabled:false"
      ></a-camera>

    </a-scene>

  </div>


  <script>

    const viewer =
      document.querySelector("#viewer");

    const model =
      document.querySelector("#renalModel");

    const root =
      document.querySelector("#modelRoot");

    const camera =
      document.querySelector("#camera");

    const statusEl =
      document.querySelector("#status");


    /* =========================================================
       ESTADO INICIAL
       ========================================================= */

    const INITIAL = {
      rx: 0,
      ry: 0,
      rz: 0,
      px: 0,
      py: 0,
      pz: 0,
      scale: 1
    };


    let state = {
      ...INITIAL
    };


    let modelLoaded =
      false;


    /* =========================================================
       APLICAR TRANSFORMACIÓN
       ========================================================= */

    function applyTransform() {

      root.object3D.rotation.set(
        THREE.MathUtils.degToRad(state.rx),
        THREE.MathUtils.degToRad(state.ry),
        THREE.MathUtils.degToRad(state.rz),
        "YXZ"
      );

      root.object3D.position.set(
        state.px,
        state.py,
        state.pz
      );

      root.object3D.scale.setScalar(
        state.scale
      );

    }


    /* =========================================================
       AUTOENCUADRE
       ========================================================= */

    function fitCameraToModel() {

      const mesh =
        model.getObject3D("mesh");

      if (!mesh) {
        return;
      }


      root.object3D.position.set(
        0,
        0,
        0
      );

      root.object3D.rotation.set(
        0,
        0,
        0
      );

      root.object3D.scale.set(
        1,
        1,
        1
      );

      root.object3D.updateMatrixWorld(true);
      model.object3D.updateMatrixWorld(true);


      const box =
        new THREE.Box3().setFromObject(mesh);

      const center =
        new THREE.Vector3();

      const size =
        new THREE.Vector3();


      box.getCenter(center);
      box.getSize(size);


      /*
        Centramos visualmente el GLB en el origen del root.
        Esto no cambia la geometría almacenada.
      */
      model.object3D.position.x -= center.x;
      model.object3D.position.y -= center.y;
      model.object3D.position.z -= center.z;

      model.object3D.updateMatrixWorld(true);


      const maxDim =
        Math.max(
          size.x,
          size.y,
          size.z
        );


      /*
        Calculamos una distancia cómoda de cámara.
      */
      const fov =
        THREE.MathUtils.degToRad(
          camera.getObject3D("camera").fov
        );

      const distance =
        (maxDim / 2) /
        Math.tan(fov / 2) *
        1.65;


      camera.object3D.position.set(
        0,
        0,
        distance
      );

      camera.object3D.lookAt(
        new THREE.Vector3(
          0,
          0,
          0
        )
      );


      state = {
        ...INITIAL
      };

      applyTransform();

      statusEl.textContent =
        "Modelo listo ✓";

      modelLoaded =
        true;

    }


    model.addEventListener(
      "model-loaded",
      () => {

        setTimeout(
          fitCameraToModel,
          120
        );

      }
    );


    model.addEventListener(
      "model-error",
      event => {

        statusEl.textContent =
          "ERROR: no se pudo cargar assets/modelo_ar_calibrado.glb";

        console.error(
          event
        );

      }
    );


    /* =========================================================
       GESTOS TÁCTILES
       ========================================================= */

    let touches = new Map();

    let previousOneFinger = null;

    let previousMidpoint = null;

    let previousDistance = null;


    function midpoint(a, b) {

      return {
        x: (a.x + b.x) / 2,
        y: (a.y + b.y) / 2
      };

    }


    function distance(a, b) {

      return Math.hypot(
        b.x - a.x,
        b.y - a.y
      );

    }


    function updateTouch(
      touch
    ) {

      touches.set(
        touch.identifier,
        {
          x: touch.clientX,
          y: touch.clientY
        }
      );

    }


    function resetGestureReferences() {

      previousOneFinger =
        null;

      previousMidpoint =
        null;

      previousDistance =
        null;

    }


    viewer.addEventListener(
      "touchstart",
      event => {

        event.preventDefault();

        for (
          const touch
          of event.changedTouches
        ) {

          updateTouch(
            touch
          );

        }

        resetGestureReferences();

      },
      {
        passive: false
      }
    );


    viewer.addEventListener(
      "touchmove",
      event => {

        event.preventDefault();

        if (!modelLoaded) {
          return;
        }


        for (
          const touch
          of event.changedTouches
        ) {

          updateTouch(
            touch
          );

        }


        const points =
          Array.from(
            touches.values()
          );


        /* -----------------------------------------------------
           1 DEDO = ROTAR
           ----------------------------------------------------- */

        if (
          points.length === 1
        ) {

          const p =
            points[0];


          if (
            previousOneFinger
          ) {

            const dx =
              p.x -
              previousOneFinger.x;

            const dy =
              p.y -
              previousOneFinger.y;


            /*
              Horizontal = giro Y
              Vertical   = giro X
            */
            state.ry +=
              dx * 0.42;

            state.rx +=
              dy * 0.42;


            /*
              Limitar X evita una sensación de bloqueo
              cerca de 90°, pero sigue permitiendo voltearlo.
            */
            if (
              state.rx > 180
            ) {
              state.rx -= 360;
            }

            if (
              state.rx < -180
            ) {
              state.rx += 360;
            }


            if (
              state.ry > 180
            ) {
              state.ry -= 360;
            }

            if (
              state.ry < -180
            ) {
              state.ry += 360;
            }


            applyTransform();

          }


          previousOneFinger =
            {
              ...p
            };


          previousMidpoint =
            null;

          previousDistance =
            null;

        }


        /* -----------------------------------------------------
           2 DEDOS = MOVER + PINCH
           ----------------------------------------------------- */

        else if (
          points.length >= 2
        ) {

          const p1 =
            points[0];

          const p2 =
            points[1];


          const mid =
            midpoint(
              p1,
              p2
            );


          const dist =
            distance(
              p1,
              p2
            );


          /*
            MOVIMIENTO DEL PUNTO MEDIO
            =========================
            Mueve el órgano por la pantalla.
          */

          if (
            previousMidpoint
          ) {

            const dx =
              mid.x -
              previousMidpoint.x;

            const dy =
              mid.y -
              previousMidpoint.y;


            /*
              Convertimos píxeles de pantalla a unidades 3D
              en función de la distancia de cámara.
            */
            const camZ =
              Math.abs(
                camera.object3D.position.z
              );


            const factor =
              camZ /
              Math.max(
                window.innerWidth,
                window.innerHeight
              ) *
              1.65;


            state.px +=
              dx * factor;


            state.py -=
              dy * factor;

          }


          /*
            PINCH
            =====
            Separar = grande
            Juntar  = pequeño
          */

          if (
            previousDistance &&
            previousDistance > 0
          ) {

            const ratio =
              dist /
              previousDistance;


            state.scale *=
              ratio;


            state.scale =
              Math.max(
                0.15,
                Math.min(
                  8.0,
                  state.scale
                )
              );

          }


          previousMidpoint =
            {
              ...mid
            };


          previousDistance =
            dist;


          previousOneFinger =
            null;


          applyTransform();

        }

      },
      {
        passive: false
      }
    );


    viewer.addEventListener(
      "touchend",
      event => {

        event.preventDefault();


        for (
          const touch
          of event.changedTouches
        ) {

          touches.delete(
            touch.identifier
          );

        }


        resetGestureReferences();

      },
      {
        passive: false
      }
    );


    viewer.addEventListener(
      "touchcancel",
      event => {

        event.preventDefault();


        for (
          const touch
          of event.changedTouches
        ) {

          touches.delete(
            touch.identifier
          );

        }


        resetGestureReferences();

      },
      {
        passive: false
      }
    );


    /* =========================================================
       RATÓN EN PC
       ========================================================= */

    let dragging =
      false;

    let lastMouse =
      null;


    viewer.addEventListener(
      "mousedown",
      event => {

        dragging =
          true;

        lastMouse = {
          x: event.clientX,
          y: event.clientY
        };

      }
    );


    window.addEventListener(
      "mouseup",
      () => {

        dragging =
          false;

        lastMouse =
          null;

      }
    );


    window.addEventListener(
      "mousemove",
      event => {

        if (
          !dragging ||
          !lastMouse ||
          !modelLoaded
        ) {

          return;

        }


        const dx =
          event.clientX -
          lastMouse.x;

        const dy =
          event.clientY -
          lastMouse.y;


        state.ry +=
          dx * 0.42;

        state.rx +=
          dy * 0.42;


        lastMouse = {
          x: event.clientX,
          y: event.clientY
        };


        applyTransform();

      }
    );


    viewer.addEventListener(
      "wheel",
      event => {

        event.preventDefault();

        if (!modelLoaded) {
          return;
        }


        state.scale *=
          event.deltaY < 0
            ? 1.08
            : 0.92;


        state.scale =
          Math.max(
            0.15,
            Math.min(
              8.0,
              state.scale
            )
          );


        applyTransform();

      },
      {
        passive: false
      }
    );


    /* =========================================================
       BOTONES
       ========================================================= */

    document
    .getElementById(
      "reset"
    )
    .addEventListener(
      "click",
      () => {

        state = {
          ...INITIAL
        };

        applyTransform();

        statusEl.textContent =
          "Pose inicial restaurada.";

      }
    );


    document
    .getElementById(
      "center"
    )
    .addEventListener(
      "click",
      () => {

        state.px =
          0;

        state.py =
          0;

        state.pz =
          0;

        applyTransform();

        statusEl.textContent =
          "Modelo centrado.";

      }
    );


    applyTransform();

  </script>

</body>
</html>
