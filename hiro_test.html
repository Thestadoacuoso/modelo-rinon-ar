<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#000000">

  <title>Prueba Hiro · AR.js</title>

  <!-- Configuración mínima oficial para marker tracking -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    a-scene {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }

    .a-enter-vr,
    .a-enter-ar,
    .a-orientation-modal {
      display: none !important;
    }

    #panel {
      position: fixed;
      z-index: 1000;
      left: 12px;
      right: 12px;
      top: 12px;
      padding: 13px 15px;
      border-radius: 14px;
      background: rgba(0,0,0,.72);
      color: white;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    #title {
      font-weight: 700;
      font-size: 17px;
      margin-bottom: 5px;
    }

    #status {
      font-size: 14px;
    }

    #counter {
      margin-top: 5px;
      font-size: 12px;
      opacity: .75;
    }

    #found {
      position: fixed;
      z-index: 1001;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: none;
      padding: 18px 24px;
      border-radius: 18px;
      background: rgba(0, 160, 70, .90);
      color: white;
      font-size: 24px;
      font-weight: 900;
      pointer-events: none;
    }
  </style>
</head>

<body>

<div id="panel">
  <div id="title">PRUEBA DEL MARCADOR HIRO</div>
  <div id="status">Iniciando cámara…</div>
  <div id="counter">Esperando AR.js…</div>
</div>

<div id="found">HIRO DETECTADO ✓</div>

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="antialias:true; alpha:true;"
  arjs="sourceType:webcam; videoTexture:true; debugUIEnabled:false;"
>
  <a-marker
    id="hiroMarker"
    preset="hiro"
    emitevents="true"
  >
    <!-- Caja GRANDE para que sea imposible no verla si detecta -->
    <a-box
      position="0 0.5 0"
      scale="0.8 0.8 0.8"
      color="#00ff66"
      material="opacity:0.95; side:double">
    </a-box>

    <a-sphere
      position="0 1.25 0"
      radius="0.22"
      color="#ff2244">
    </a-sphere>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  const marker = document.querySelector('#hiroMarker');
  const status = document.querySelector('#status');
  const counter = document.querySelector('#counter');
  const found = document.querySelector('#found');

  let foundCount = 0;
  let lostCount = 0;

  marker.addEventListener('markerFound', () => {
    foundCount++;
    status.textContent = 'MARCADOR DETECTADO ✓';
    counter.textContent = `Detectado: ${foundCount} · Perdido: ${lostCount}`;
    found.style.display = 'block';
    console.log('HIRO FOUND');
  });

  marker.addEventListener('markerLost', () => {
    lostCount++;
    status.textContent = 'Marcador perdido · vuelve a enfocarlo';
    counter.textContent = `Detectado: ${foundCount} · Perdido: ${lostCount}`;
    found.style.display = 'none';
    console.log('HIRO LOST');
  });

  document.querySelector('a-scene').addEventListener('loaded', () => {
    status.textContent = 'Cámara lista · apunta al Hiro';
    counter.textContent = 'Si lo detecta verás una caja verde encima.';
  });

  // Diagnóstico adicional: revisa visibilidad del marcador.
  setInterval(() => {
    if (marker.object3D && marker.object3D.visible) {
      status.textContent = 'MARCADOR VISIBLE ✓';
      found.style.display = 'block';
    }
  }, 250);
</script>

</body>
</html>
