<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visor 3D diagnóstico · Riñón</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #091019;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      overflow: hidden;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: #091019;
    }

    #panel {
      position: fixed;
      z-index: 20;
      left: 14px;
      right: 14px;
      top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(5, 10, 18, .82);
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    #title {
      font-weight: 700;
      margin-bottom: 4px;
    }

    #status {
      font-size: 13px;
      color: rgba(255,255,255,.84);
    }

    #error {
      margin-top: 5px;
      font-family: Consolas, monospace;
      font-size: 11px;
      color: #ffb4b4;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div id="panel">
  <div id="title">Visor 3D · prueba del GLB</div>
  <div id="status">Intentando cargar ./assets/modelo.glb…</div>
  <div id="error"></div>
</div>

<model-viewer
  id="viewer"
  src="./assets/modelo.glb"
  alt="Modelo renal 3D"
  camera-controls
  touch-action="pan-y"
  loading="eager"
  reveal="auto"
  shadow-intensity="1"
  exposure="1.15"
  environment-image="neutral"
  interaction-prompt="auto">
</model-viewer>

<script type="module">
  const viewer = document.querySelector('#viewer');
  const status = document.querySelector('#status');
  const error = document.querySelector('#error');

  viewer.addEventListener('load', () => {
    status.textContent = 'Modelo cargado correctamente ✓';
    error.textContent = '';
    console.log('GLB cargado correctamente');
  });

  viewer.addEventListener('error', (event) => {
    status.textContent = 'ERROR cargando el GLB';
    error.textContent =
      'Revisa que exista exactamente: /assets/modelo.glb\n' +
      'Prueba abrir directamente:\n' +
      location.origin + '/assets/modelo.glb';

    console.error('Error model-viewer:', event);
  });
</script>

</body>
</html>
